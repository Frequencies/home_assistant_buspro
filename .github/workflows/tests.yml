name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/custom_components/buspro
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if python3 "$f"; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              fail=1
            fi
          done < <(find custom_components/buspro/tests -name "test_*.py" | sort)
          exit $fail
